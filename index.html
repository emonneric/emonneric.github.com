<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FISIK Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chat-container">
    <header>
      <h1>FISIK Chatbot</h1>
    </header>
    <div id="chatbox">
      <div id="messages"></div>
    </div>
    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Tapez votre message..." autocomplete="off" required>
      <button type="submit">Envoyer</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
